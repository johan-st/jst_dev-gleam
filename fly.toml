# Fly.io configuration for jst_dev
# Gleam/BEAM server with SQLite + LiteFS

app = 'jst-dev'
primary_region = 'arn'

[env]
  PORT = '8080'
  DB_PATH = '/litefs/db.sqlite'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'litefs'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
