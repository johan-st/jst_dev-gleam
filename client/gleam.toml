plinth = ">= 0.7.2 and < 1.0.0"
omnimessage_lustre = ">= 0.3.0 and < 1.0.0"

# Shared domain + protocol
jst_shared = { path = "../shared" }
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gluid = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.0.0 and < 3.0.0"
qcheck = ">= 1.0.0 and < 2.0.0"
