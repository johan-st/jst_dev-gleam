# LiteFS configuration for SQLite replication on Fly.io

fuse:
  dir: "/litefs"

data:
  dir: "/data"

lease:
  type: "consul"
  candidate: ${FLY_REGION == PRIMARY_REGION}
  promote: true
  advertise-url: "http://${FLY_ALLOC_ID}.vm.${FLY_APP_NAME}.internal:20202"

  consul:
    url: "${FLY_CONSUL_URL}"
    key: "${FLY_APP_NAME}/primary"

exec:
  - cmd: "/app/entrypoint.sh run"

